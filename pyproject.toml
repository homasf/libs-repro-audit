[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-libs-repro-audit"
version = "2.0.0"
description = "CF-LIBS Reproducibility Audit: executable A1-A5 audit engine that reconstructs quantitative claims from printed CF-LIBS/LIPS records."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Homa Saeidfirozeh" },
  { name = "Martin Ferus" },
]
keywords = ["LIBS", "LIPS", "calibration-free", "reproducibility", "metrology", "Stark broadening"]
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/homasf/cf-libs-repro-audit"
Repository = "https://github.com/homasf/cf-libs-repro-audit"
Issues = "https://github.com/homasf/cf-libs-repro-audit/issues"

[project.scripts]
cf-libs-audit = "libs_repro_audit.cli:main"
cf-libs-audit-extract = "libs_repro_audit.extract:main"
libs-audit = "libs_repro_audit.cli:main"
libs-audit-extract = "libs_repro_audit.extract:main"
libs-repro-audit = "libs_repro_audit.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libs_repro_audit = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
